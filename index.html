<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>笔记助手 · 文本整理工具</title>
<meta name="description" content="文本统计、去空行、去重、排序、大小写转换">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#66bb6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="笔记助手">
<style>

:root{
  --bg:#f4f5f7;           /* 页面底色：浅灰，避免纯白刺眼 */
  --bg-glow:#ffffff;      /* 顶部径向光晕色，制造轻微的空间感 */
  --surface:#ffffff;      /* 卡片底色 */
  --surface-2:#fafbfc;    /* 卡片内的次级区块（输入框、结果区） */
  --text:#16181d;         /* 主文字 */
  --soft:#5d636e;         /* 次要文字 */
  --mute:#8b929e;         /* 弱化文字（提示、单位、占位符） */
  --line:#e6e8ec;         /* 分割线与边框 */
  --accent:#26a69a;       /* 强调色（各玩具不同） */
  --accent-soft:#e6f4f2;  /* 强调色的浅色版，用于底色块 */
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  /* 顶部一层极淡光晕，比死板的纯色更有层次 */
  background-image:radial-gradient(120% 80% at 50% 0%, var(--bg-glow) 0%, rgba(255,255,255,0) 62%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}

.app{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:20px}

.head{text-align:center}
.head h1{font-size:22px; font-weight:600; letter-spacing:.5px}
.head p{font-size:13px; color:var(--mute); margin-top:6px}

.card{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow);
}

.stage{
  width:288px; height:288px; position:relative;
  background:var(--surface); border:1px solid var(--line);
  border-radius:50%; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
}
.stage canvas{border-radius:50%}

.phase{
  font-size:29px; font-weight:300; letter-spacing:6px;
  color:var(--accent); min-height:42px; text-align:center;
  transition:color .4s var(--ease);
}
.cd{font-size:15px; color:var(--soft); font-variant-numeric:tabular-nums; min-height:22px}
.meta{font-size:13px; color:var(--mute); min-height:20px; text-align:center}

.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.stats{display:flex; gap:10px; width:100%}
.stat{
  flex:1; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:12px; text-align:center;
}
.stat .k{font-size:11px; color:var(--mute); letter-spacing:1px}
.stat .v{font-size:21px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums}

.chip{
  padding:9px 18px; font-size:13px; font-weight:500; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.14);
}

.btn{
  padding:13px 42px; font-size:15px; font-weight:600; font-family:inherit;
  letter-spacing:3px; background:var(--accent); color:#fff;
  border:none; border-radius:var(--r-md); cursor:pointer;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--soft); box-shadow:none}

.lang{
  position:fixed; top:16px; right:16px; z-index:20;
  padding:7px 14px; font-size:12px; font-weight:600; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.lang:hover{border-color:var(--accent); color:var(--accent)}

.hint{font-size:12px; color:var(--mute); text-align:center; line-height:1.7}

@media (max-width:380px){
  .stage{width:250px;height:250px}
  .phase{font-size:25px; letter-spacing:4px}
}

:root{ --accent:#66bb6a; --accent-soft:#e8f5e9; }

textarea.ta{
  width:100%; min-height:180px; padding:16px; font-size:15px; font-family:inherit;
  line-height:1.8; border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--surface-2); color:var(--text); resize:vertical;
}
textarea.ta:focus{outline:none; border-color:var(--accent); background:var(--surface)}
.tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}

</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
<div class="app">

  <div class="head">
    <h1 id="t_title">笔记助手</h1>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k" id="t_chars">字符</div><div class="v" id="vChars">0</div></div>
      <div class="stat"><div class="k" id="t_words">词数</div><div class="v" id="vWords">0</div></div>
      <div class="stat"><div class="k" id="t_lines">行数</div><div class="v" id="vLines">0</div></div>
    </div>
  </div>

  <div class="card">
    <textarea class="ta" id="ta" placeholder="粘贴或输入文本…" oninput="stat()"></textarea>
    <div class="tools" id="tools"></div>
  </div>

  <div class="row">
    <button class="btn ghost" onclick="downloadTxt()">下载</button>
  </div>

  <div class="hint" id="t_hint">所有处理都在本地完成，不上传</div>

</div>
<script>

/* ============================================================
 * 笔记助手 · 文本整理
 * ------------------------------------------------------------
 * 工具箱设计：
 *   每个整理操作都是一个「纯函数」——接收字符串，返回新字符串。
 *   纯函数的好处：可单独测试、可随意组合、不会互相污染状态。
 * ========================================================== */

const ta = document.getElementById('ta');

const I18N = {
  zh:{ title:'笔记助手', hint:'所有处理都在本地完成，不上传',
       chars:'字符', words:'词数', lines:'行数',
       trim:'去首尾空格', squeeze:'压缩空行', dedupe:'去重行',
       sort:'排序行', upper:'转大写', lower:'转小写',
       clear:'清空', download:'下载', copied:'已复制' },
  en:{ title:'Note Helper', hint:'Everything runs locally',
       chars:'Chars', words:'Words', lines:'Lines',
       trim:'Trim', squeeze:'Squeeze', dedupe:'Dedupe',
       sort:'Sort', upper:'Upper', lower:'Lower',
       clear:'Clear', download:'Download', copied:'Copied' }
};
let lang = 'zh';

/* ---------- 整理操作（纯函数） ---------- */

/** 去掉每行首尾空白 */
function doTrim(s){
  return s.split('\n').map(function(l){ return l.trim(); }).join('\n');
}

/** 把连续多个空行压成一个 */
function doSqueeze(s){
  return s.replace(/\n{3,}/g, '\n\n');
}

/** 去掉重复行，保留首次出现的顺序 */
function doDedupe(s){
  const seen = {};
  const out = [];
  s.split('\n').forEach(function(l){
    if (!seen[l]){ seen[l] = 1; out.push(l); }
  });
  return out.join('\n');
}

/** 按字典序排序行 */
function doSort(s){
  return s.split('\n').slice().sort().join('\n');
}

/* ---------- 统计 ---------- */

/** 统计字符数、词数、行数。词数按「空白分隔的非空片段」计算 */
function stat(){
  const t = ta.value;
  document.getElementById('vChars').textContent = t.length;
  document.getElementById('vWords').textContent = t.trim() ? t.trim().split(/\s+/).length : 0;
  document.getElementById('vLines').textContent = t ? t.split('\n').length : 0;
}

/* ---------- 界面 ---------- */

const TOOLS = [
  ['trim',  function(){ return doTrim(ta.value); }],
  ['squeeze',function(){ return doSqueeze(ta.value); }],
  ['dedupe', function(){ return doDedupe(ta.value); }],
  ['sort',  function(){ return doSort(ta.value); }],
  ['upper', function(){ return ta.value.toUpperCase(); }],
  ['lower', function(){ return ta.value.toLowerCase(); }]
];

function buildTools(){
  const box = document.getElementById('tools');
  box.innerHTML = '';
  TOOLS.forEach(function(item){
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = I18N[lang][item[0]];
    b.onclick = function(){
      ta.value = item[1]();      /* 调用纯函数，用返回值覆盖输入框 */
      stat();
    };
    box.appendChild(b);
  });
}

function refresh(){
  const L = I18N[lang];
  document.getElementById('t_title').textContent = L.title;
  document.getElementById('t_hint').textContent  = L.hint;
  document.getElementById('t_chars').textContent = L.chars;
  document.getElementById('t_words').textContent = L.words;
  document.getElementById('t_lines').textContent = L.lines;
  document.getElementById('langBtn').textContent = (lang==='zh') ? 'EN' : '中';
  buildTools();
}
function toggleLang(){ lang = (lang==='zh') ? 'en' : 'zh'; refresh(); }

/** 导出 .txt（Blob + 临时 a 标签，纯前端，无需服务器） */
function downloadTxt(){
  const blob = new Blob([ta.value], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'note.txt'; a.click();
  URL.revokeObjectURL(url);
}

refresh();
stat();

/* ---------- PWA 注册 ----------
 * 注册 Service Worker 后本页被缓存，断网也能打开。
 * 放在最后且 catch 掉异常：即使浏览器不支持也不影响正常功能。 */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
